<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SaitamaAPI Docs</title><link rel="stylesheet" href="/style.css"></head><body><main><section class="card hero"><h1>📚 SaitamaAPI Docs</h1><p>API key: <code>x-api-key</code>, Bearer o <code>?apikey=</code></p></section><div id="docs"></div></main><script>fetch('/api/docs').then(r=>r.json()).then(d=>document.getElementById('docs').innerHTML=d.endpoints.map(e=>`<section class="card"><h2>${e.name}</h2><code>${e.method} ${e.path}</code><p>${e.description}</p></section>`).join(''))</script></body></html>
