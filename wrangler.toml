name = "saitamaapi"
main = "src/worker.js"
compatibility_date = "2026-10-01"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/auth/*", "/dashboard/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "saitamaapi-pro-db"
database_id = "61695362-8c8a-411b-9c6c-2395a4000938"

[vars]
APP_NAME = "SaitamaAPI PRO"
APP_ORIGIN = "https://saitamaapi.wilianromero268.workers.dev"
DAILY_LIMIT = "450"
ADMIN_EMAILS = "TU_GMAIL_ADMIN"
